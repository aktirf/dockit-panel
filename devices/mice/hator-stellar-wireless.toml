notes = "The 2.4 GHz receiver reports itself as 'STELLAR WIRELESS' (vendor Compx). Seen with two different IDs (3607 and 3608) in two scans. libratbag (ratbagctl list) does not know this mouse, so battery, DPI and polling rate cannot be read or changed from Linux at the moment. Only detection works. If you find a way (for example a wired mode with a different USB ID), please open a Device report issue."
