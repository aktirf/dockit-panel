[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockit-panel"
version = "0.1.0"
description = "DOCKIT: Device and Operational Control Kit for Integrated Tuning. A Linux laptop control panel that shows what works on your machine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dockit = "dockit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
